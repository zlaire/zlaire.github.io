    <script>
        const PASSWORD_SALT = "65663ea8ce5342d4b373cdccb21a6ecd";
        const EXPECTED_HASH = "edfccc3b89c73057ce8164cd350a146131bd8e82a45dc14a770ea6d1110e5d70";

        async function sha256Hex(text) {
            const data = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        async function checkPassword(event) {
            if (event) event.preventDefault();
            const inputEl = document.getElementById("passwordInput");
            const errorEl = document.getElementById("loginError");
            const password = inputEl.value;

            if (!window.crypto || !window.crypto.subtle) {
                errorEl.textContent = "Web Crypto API requires HTTPS or localhost.";
                errorEl.style.display = "block";
                return;
            }

            const candidateHash = await sha256Hex(PASSWORD_SALT + password);
            if (candidateHash === EXPECTED_HASH) {
                document.getElementById("loginPage").style.display = "none";
                document.getElementById("verifyPage_main").style.display = "block";
                inputEl.value = "";
                errorEl.style.display = "none";
            } else {
                errorEl.textContent = "Incorrect password. Please try again.";
                errorEl.style.display = "block";
                inputEl.value = "";
                inputEl.focus();
            }
        }
    </script>
